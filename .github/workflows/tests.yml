name: Testes

# Lint, typecheck e testes automatizados a cada push e pull request
# (requisito da disciplina de Qualidade e Testes de Software).
on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App Expo (lint + typecheck + Jest)
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run test:coverage -- --ci

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-app
          path: coverage/
